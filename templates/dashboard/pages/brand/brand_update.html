{% extends 'dashboard/components/base.html' %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-xl shadow p-6">
    <div class="flex items-center mb-6">
      <a href="{% url 'admin_brand_list' %}" class="text-gray-600 hover:text-gray-800 mr-4">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1 class="text-2xl font-semibold text-gray-800"><i class="fas fa-edit"></i> Edit Brand</h1>
    </div>

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
          Brand Name <span class="text-red-500">*</span>
        </label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter brand name"
          value="{{ brand.name }}"
        >
        <p class="mt-1 text-sm text-gray-500">Current slug: <span class="font-mono text-blue-600">{{ brand.slug }}</span></p>
      </div>

      <div class="bg-gray-50 p-4 rounded-lg">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Brand Information</h3>
        <div class="grid grid-cols-2 gap-4 text-sm">
          <div>
            <span class="text-gray-600">Created:</span>
            <span class="font-medium">{{ brand.created_at|date:"M d, Y H:i" }}</span>
          </div>
          <div>
            <span class="text-gray-600">Brand ID:</span>
            <span class="font-medium">#{{ brand.id }}</span>
          </div>
        </div>
      </div>

      <div class="flex gap-4">
        <button 
          type="submit" 
          class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition"
        >
          <i class="fas fa-save mr-1"></i> Update Brand
        </button>
        <a 
          href="{% url 'admin_brand_list' %}" 
          class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition"
        >
          <i class="fas fa-times mr-1"></i> Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
