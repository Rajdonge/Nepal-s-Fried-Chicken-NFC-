<!-- Sidebar Filter Component -->
<form method="GET">
<aside class="hidden lg:block space-y-4 sticky top-20">

  <!-- Price Filter Box -->
  <div class="bg-white shadow-md rounded-lg p-4 border border-gray-100">
    <div class="flex items-center justify-between mb-3">
      <h5 class="text-base font-bold text-gray-900">Price Range</h5>
      <button type="button" id="resetPrice" class="text-xs cursor-pointer text-orange-600 hover:text-orange-700 font-medium transition">
        Reset
      </button>
    </div>

    <div class="space-y-3">
      <div class="flex gap-2">
        <div class="flex-1">
          <label for="minPrice" class="text-xs font-semibold text-gray-600 uppercase mb-1 block">Min</label>
          <div class="relative">
            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">Rs</span>
            <input id="minPrice" type="number" placeholder="0" min="0"
              class="w-full pl-7 pr-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-orange-500 text-sm font-medium text-gray-900">
          </div>
        </div>
        <div class="flex-1">
          <label for="maxPrice" class="text-xs font-semibold text-gray-600 uppercase mb-1 block">Max</label>
          <div class="relative">
            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">Rs</span>
            <input id="maxPrice" type="number" placeholder="10000" min="0"
              class="w-full pl-7 pr-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-orange-500 text-sm font-medium text-gray-900">
          </div>
        </div>
      </div>

      <div class="space-y-1.5">
        <div class="flex items-center justify-between text-xs text-gray-600">
          <span>Rs 0</span>
          <span id="rangeValue" class="font-bold text-orange-600">Rs 10000</span>
        </div>
        <input type="range" id="priceRange" min="0" max="10000" value="10000" step="100"
          class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-orange-500">
      </div>
    </div>
  </div>

  <!-- Restaurants Filter Box -->
  {% if restaurants %}
  <div class="bg-white shadow-md rounded-lg p-4 border border-gray-100">
    <div class="flex items-center justify-between mb-3">
      <h5 class="text-base font-bold text-gray-900">Restaurants</h5>
      <button type="button" id="resetRestaurants" class="cursor-pointer text-xs text-orange-600 hover:text-orange-700 font-medium transition">
        Clear
      </button>
    </div>

    <div class="max-h-80 overflow-y-auto pr-1 space-y-2">
      {% for restaurant in restaurants %}
      <label class="flex items-center gap-2 cursor-pointer hover:bg-orange-50 p-2 rounded-md transition group">
        <input type="checkbox" name="restaurant" value="{{ restaurant.id }}"
               class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-1 focus:ring-orange-500 cursor-pointer">
        <span class="text-sm font-medium text-gray-700 group-hover:text-orange-600 transition flex-1">
          {{ restaurant.restaurant_name }}
        </span>
        <span class="text-xs text-gray-400">{{ restaurant.menu_items.count }}</span>
      </label>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <!-- Veg/Non-Veg Filter Box -->
  <div class="bg-white shadow-md rounded-lg p-4 border border-gray-100">
    <div class="flex items-center justify-between mb-3">
      <h5 class="text-base font-bold text-gray-900">Type</h5>
      <button type="button" id="resetVeg" class="cursor-pointer text-xs text-orange-600 hover:text-orange-700 font-medium transition">
        Clear
      </button>
    </div>

    <div class="space-y-2">
      <label class="flex items-center gap-2 cursor-pointer hover:bg-orange-50 p-2 rounded-md transition group">
        <input type="checkbox" name="veg" value="veg"
               class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-1 focus:ring-orange-500 cursor-pointer">
        <span class="text-sm font-medium text-gray-700 group-hover:text-orange-600 transition flex-1">
          Vegetarian
        </span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer hover:bg-orange-50 p-2 rounded-md transition group">
        <input type="checkbox" name="veg" value="non-veg"
               class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-1 focus:ring-orange-500 cursor-pointer">
        <span class="text-sm font-medium text-gray-700 group-hover:text-orange-600 transition flex-1">
          Non-Vegetarian
        </span>
      </label>
    </div>
  </div>

</aside>
</form>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Reset restaurants
  const resetRestaurantsBtn = document.getElementById('resetRestaurants');
  if (resetRestaurantsBtn) {
    resetRestaurantsBtn.addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelectorAll('input[name="restaurant"]').forEach(cb => cb.checked = false);
    });
  }

  // Reset veg filter
  const resetVegBtn = document.getElementById('resetVeg');
  if (resetVegBtn) {
    resetVegBtn.addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelectorAll('input[name="veg"]').forEach(cb => cb.checked = false);
    });
  }

  // Reset price
  document.getElementById('resetPrice').addEventListener('click', function(e) {
    e.preventDefault();
    document.getElementById('minPrice').value = '';
    document.getElementById('maxPrice').value = '';
    const range = document.getElementById('priceRange');
    range.value = range.max;
    document.getElementById('rangeValue').textContent = `Rs ${range.value}`;
  });

  // Price range slider sync
  const priceRange = document.getElementById('priceRange');
  const maxPriceInput = document.getElementById('maxPrice');
  priceRange.addEventListener('input', function() {
    document.getElementById('rangeValue').textContent = `Rs ${this.value}`;
    maxPriceInput.value = this.value;
  });
  maxPriceInput.addEventListener('input', function() {
    priceRange.value = this.value;
    document.getElementById('rangeValue').textContent = `Rs ${this.value}`;
  });
});
</script>
